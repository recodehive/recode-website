# Minimal Supabase CLI config for the giveaway backend.
# The function checks the visitor's Clerk token itself (sent in the x-clerk-token header), so the
# gateway's own JWT check is switched off for it.
project_id = "recodehive-giveaway"

[functions.giveaway]
verify_jwt = false

# Public read-only data from GitHub, cached for a week. No sign-in needed.
[functions.profile]
verify_jwt = false

# Public share image for developer profiles.
[functions.og]
verify_jwt = false
