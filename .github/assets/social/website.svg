<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out 0.00s infinite; }
    .icon { transform-box: fill-box; transform-origin: center; animation: bob 2.4s ease-in-out 0.00s infinite; }
    @keyframes pulse { 0% { transform: scale(.82); opacity: .55 } 70%,100% { transform: scale(1.25); opacity: 0 } }
    @keyframes bob { 0%,100% { transform: translateY(0) scale(1) } 50% { transform: translateY(-2.5px) scale(1.07) } }
  </style>
  <rect class="ring" x="6" y="6" width="44" height="44" rx="12" fill="#2e8555"/>
  <g class="icon">
    <rect x="6" y="6" width="44" height="44" rx="12" fill="#2e8555"/>
    <g transform="translate(16 16) scale(1)"><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5"/><path d="M3.5 12h17M5 7.5h14M5 16.5h14"/></g></g>
  </g>
</svg>
