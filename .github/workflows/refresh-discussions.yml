name: Refresh Discussions

# The Community Discussions page is built from GitHub Discussions at build time.
# This job triggers a fresh deploy every 6 hours so the page stays current.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL secret is not set, skipping"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
