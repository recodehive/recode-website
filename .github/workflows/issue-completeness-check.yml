name: Issue Completeness Check

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  check-completeness:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze issue details
        id: ai
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue?.title ?? "").trim();
            const body = (context.payload.issue?.body ?? "").trim();
            const normalizedBody = body.replace(/\r/g, "");
            const commentStrippedBody = normalizedBody.replace(/<!--[\s\S]*?-->/g, "");
            const contentOnly = commentStrippedBody
              .replace(/!\[[^\]]*\]\([^)]+\)/g, " ")
              .replace(/<img[^>]*>/gi, " ")
              .replace(/https?:\/\/\S+/gi, " ")
              .replace(/[_*`>#-]/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            const headings = Array.from(
              commentStrippedBody.matchAll(/^#{2,3}\s+(.+)$/gm),
              ([, heading]) => heading.trim(),
            );
            const normalizeHeading = (heading) =>
              heading.replace(/\s+/g, " ").trim().toLowerCase();
            const normalizedHeadings = headings.map((heading) => normalizeHeading(heading));
            const getSection = (heading) => {
              const actualHeading =
                headings.find((candidate) => normalizeHeading(candidate) === normalizeHeading(heading)) ?? heading;
              const escapedHeading = actualHeading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = commentStrippedBody.match(
                new RegExp(`^#{2,3}\\s+${escapedHeading}[ \\t]*\\r?\\n([\\s\\S]*?)(?=^#{2,3}\\s+|$)`, "m"),
              );

              if (!match) {
                return "";
              }

              return match[1].trim();
            };

            const isMissingValue = (value) => {
              const cleaned = value
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/\r/g, "")
                .trim();
              const normalized = cleaned
                .replace(/[*_`~]/g, "")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();

              return (
                normalized === "" ||
                normalized === "no response" ||
                normalized === "n/a" ||
                normalized === "na" ||
                normalized === "none" ||
                normalized === "not applicable"
              );
            };

            const missingDetails = [];
            const addMissing = (detail) => {
              if (!missingDetails.includes(detail)) {
                missingDetails.push(detail);
              }
            };

            if (title.length < 10) {
              addMissing("Provide a more specific title that summarizes the request or problem.");
            }

            if (contentOnly.length < 80) {
              addMissing("Describe the problem or request in enough detail for maintainers to understand it.");
            }

            const requiredSectionsByTitle = [
              {
                name: "bug",
                sections: [
                  "Describe the bug",
                  "Expected behavior",
                ],
              },
              {
                name: "feature",
                sections: [
                  "Feature Description",
                  "Use Case",
                  "Priority",
                ],
              },
              {
                name: "docs",
                sections: [
                  "Issue Description",
                  "Suggested Change",
                  "Urgency",
                ],
              },
            ];

            const matchedTemplate = requiredSectionsByTitle
              .map((template) => ({
                ...template,
                matchedSections: template.sections.filter((section) =>
                  normalizedHeadings.includes(normalizeHeading(section)),
                ).length,
              }))
              .filter((template) => template.matchedSections > 0)
              .sort((left, right) => right.matchedSections - left.matchedSections)[0];

            if (matchedTemplate) {
              for (const section of matchedTemplate.sections) {
                if (!normalizedHeadings.includes(normalizeHeading(section)) || isMissingValue(getSection(section))) {
                  addMissing(`Fill in the "${section}" section.`);
                }
              }
            } else {
              const hasStructure = headings.length > 0;
              const hasStructuredSignals = [
                /steps?\s+to\s+reproduce/i,
                /expected\s+behavior/i,
                /actual\s+behavior/i,
                /current\s+behavior/i,
                /use\s+case/i,
                /\bimpact\b/i,
                /(^|\n)\s{0,3}(?:#{2,3}\s*)?priority\b\s*:?/i,
                /\benvironment\b/i,
                /\bbrowser\b/i,
              ].some((pattern) => pattern.test(commentStrippedBody));
              const contentHeadings = headings.filter(
                (heading) => {
                  const normalizedHeading = normalizeHeading(heading);
                  return !(
                    normalizedHeading.startsWith("record") ||
                    normalizedHeading.startsWith("add screenshot")
                  );
                },
              );
              const hasMeaningfulHeadingContent = contentHeadings.some(
                (heading) => !isMissingValue(getSection(heading)),
              );

              if (contentHeadings.length > 0 && !hasMeaningfulHeadingContent) {
                addMissing("Fill in the issue details instead of leaving placeholder responses.");
              }

              if (!hasStructure && !hasStructuredSignals) {
                addMissing("Explain the expected outcome, use case, or current problem more clearly.");
              }
            }

            core.setOutput("response", missingDetails.map((detail) => `- ${detail}`).join("\n"));

      - name: Request missing issue details
        if: ${{ steps.ai.outputs.response != '' }}
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- issue-completeness-check -->";
            const response = process.env.AI_RESPONSE?.trim();
            if (!response) {
              core.info("Issue is complete enough; no comment needed.");
              return;
            }

            const missingDetails = response
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean)
              .filter((line) => !/^```/.test(line))
              .map((line) => line.replace(/^[-*]\s*/, ""))
              .map((line) => line.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1"))
              .map((line) => line.replace(/https?:\/\/\S+/gi, "[link removed]"))
              .map((line) => line.replace(/[<>`]/g, ""))
              .map((line) => line.replace(/@/g, "@\u200b"))
              .map((line) => line.slice(0, 180))
              .slice(0, 6);

            if (missingDetails.length === 0) {
              core.info("AI response did not contain usable missing-detail bullets.");
              return;
            }

            const body = [
              marker,
              "Thanks for opening this issue. To help maintainers review it faster, please add the missing details below:",
              "",
              ...missingDetails.map((detail) => `- ${detail}`),
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
